[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zimage-service"
version = "0.1.0"
description = "Z-Image Web Service"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0",
    "diffusers>=0.32.0",
    "transformers>=4.51.0",
    "safetensors",
    "pillow",
    "accelerate",
    "huggingface_hub>=0.25.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "python-multipart>=0.0.18",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "ruff"
]

[tool.setuptools.packages.find]
include = ["app*"]
